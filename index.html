<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Photo BL · Chalet Copains</title>
<meta name="theme-color" content="#f6f4ef">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Photo BL">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  html, body { margin: 0; height: 100%; background: #f6f4ef; overflow: hidden; }
  @media (prefers-color-scheme: dark) { html, body { background: #171716; } }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
<!--
  Page d'entrée « Photo BL » du Chalet Copains (même principe que la pointeuse).
  Elle affiche la page Apps Script « Photo BL » à l'intérieur de cette page :
  Google ne montre alors plus son bandeau « Cette application a été créée par un utilisateur de Google Apps Script ».
  La clé personnelle (?t=...) de l'adresse est transmise telle quelle à la page Apps Script (sans elle : « Lien invalide »).
  Si la page est redéployée sous une NOUVELLE adresse, changer PHOTO_BL ci-dessous.
-->
<iframe id="app" title="Photo BL" allow="camera; clipboard-write"></iframe>
<script>
  var PHOTO_BL = 'https://script.google.com/macros/s/AKfycbzXZFMreJq1RSHU6GzOJ79rjnEw0p9MIINkwSS7VOepfozp8NGQFuaxzsfA-Yt1x5gatw/exec';
  var t = new URLSearchParams(location.search).get('t') || '';
  document.getElementById('app').src = PHOTO_BL + (t ? '?t=' + encodeURIComponent(t) : '');
</script>
</body>
</html>
